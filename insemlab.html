<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
        }

        header {
            background: #172554;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            background: #1e3a8a;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-weight: bold;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .welcome {
            background: #dbeafe;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        h2 {
            color: #1e3a8a;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        #message, #resultMessage {
            color: green;
            font-weight: bold;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }

            nav a {
                margin: 5px;
            }

            .container {
                width: 92%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Learn • Grow • Achieve</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#registration">Registration</a>
    <a href="#results">Results</a>
    <a href="#students">Students</a>
</nav>

<div class="container">

    <section class="welcome" id="home">
        <h2>Welcome to Student Portal</h2>
        <p>Manage student registrations and academic results easily.</p>
    </section>

    <div class="cards">

        <section class="card" id="registration">
            <h2>Student Registration</h2>

            <form id="studentForm">
                <input type="text" id="name"
                       placeholder="Student Name" required>

                <input type="text" id="roll"
                       placeholder="Roll Number" required>

                <input type="text" id="course"
                       placeholder="Course Name" required>

                <button type="submit">Register Student</button>
            </form>

            <p id="message"></p>
        </section>

        <section class="card" id="results">
            <h2>Student Results</h2>

            <input type="text" id="resultRoll"
                   placeholder="Enter Roll Number">

            <input type="number" id="marks"
                   placeholder="Enter Marks" min="0" max="100">

            <button onclick="showResult()">Check Result</button>

            <p id="resultMessage"></p>
        </section>

    </div>

    <section id="students">
        <h2>Registered Students</h2>

        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentList"></tbody>
        </table>
    </section>

</div>

<footer>
    <p>&copy; 2026 Student Management System</p>
</footer>

<script>
    let students = JSON.parse(
        localStorage.getItem("students") || "[]"
    );

    function displayStudents() {
        let list = document.getElementById("studentList");

        list.innerHTML = students.map((s, i) =>
            `<tr>
                <td>${s.roll}</td>
                <td>${s.name}</td>
                <td>${s.course}</td>
                <td><button onclick="deleteStudent(${i})">
                    Delete
                </button></td>
            </tr>`
        ).join("");
    }

    document.getElementById("studentForm")
    .addEventListener("submit", function(e) {
        e.preventDefault();

        let name = document.getElementById("name").value.trim();
        let roll = document.getElementById("roll").value.trim();
        let course = document.getElementById("course").value.trim();

        if (students.some(s => s.roll === roll)) {
            document.getElementById("message").innerText =
                "Roll number already exists!";
            return;
        }

        students.push({
            name: name,
            roll: roll,
            course: course
        });

        localStorage.setItem("students", JSON.stringify(students));

        document.getElementById("message").innerText =
            "Student Registered Successfully!";

        this.reset();
        displayStudents();
    });

    function showResult() {
        let roll = document.getElementById("resultRoll").value.trim();
        let marksInput = document.getElementById("marks").value;
        let marks = Number(marksInput);

        let student = students.find(s => s.roll === roll);

        if (!student) {
            document.getElementById("resultMessage").innerText =
                "Student not found!";
            return;
        }

        if (marksInput === "" || marks < 0 || marks > 100) {
            document.getElementById("resultMessage").innerText =
                "Enter marks between 0 and 100!";
            return;
        }

        document.getElementById("resultMessage").innerText =
            student.name + " - " + marks + " Marks - " +
            (marks >= 40 ? "Pass" : "Fail");
    }

    function deleteStudent(index) {
        students.splice(index, 1);

        localStorage.setItem("students", JSON.stringify(students));

        displayStudents();
    }

    displayStudents();
</script>

</body>
</html>
